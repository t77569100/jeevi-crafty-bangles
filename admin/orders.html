<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Orders Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #C76B85;
      --bg-cream: #FFF8F0;
      --text-dark: #3B2A24;
      --card-pink: #FCE8EF;
      --white: #FFFFFF;
      --btn-rose: #B84F70;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 70px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-pink);
    }

    h2 {
      color: var(--primary);
      font-size: 1.3rem;
    }

    .nav-links a {
      color: var(--btn-rose);
      text-decoration: none;
      font-weight: bold;
      margin-left: 14px;
      font-size: 0.9rem;
    }

    .order-card {
      background: var(--white);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--card-pink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 1px solid #f0e4e7;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .order-details p {
      font-size: 0.85rem;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .order-items {
      background: var(--bg-cream);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.85rem;
    }

    .order-total {
      font-size: 1rem;
      font-weight: bold;
      color: var(--btn-rose);
      text-align: right;
      margin-top: 6px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body>

  <header>
    <h2>ஆர்டர்கள் மேலாண்மை</h2>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="../index.html">Storefront</a>
    </div>
  </header>

  <div id="ordersContainer">
    <p style="text-align: center; color: #888;">ஆர்டர்கள் ஏற்றப்படுகின்றன...</p>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      collection, 
      getDocs, 
      onAuthStateChanged 
    } from "../js/firebase-config.js";

    const ADMIN_EMAIL = "tharuntharu7489@gmail.com";
    const ordersContainer = document.getElementById("ordersContainer");

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email === ADMIN_EMAIL) {
        loadOrders();
      } else {
        alert("அனுமதி இல்லை! Admin மட்டும் இந்த பக்கத்தைப் பார்க்க முடியும்.");
        window.location.href = "../login.html";
      }
    });

    async function loadOrders() {
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        
        if (querySnapshot.empty) {
          ordersContainer.innerHTML = "<p style='text-align: center; padding: 20px;'>ஆர்டர்கள் எதுவும் இதுவரை வரவில்லை.</p>";
          return;
        }

        let html = "";
        querySnapshot.forEach((doc) => {
          const order = doc.data();
          
          // வாடிக்கையாளர் வாங்கிய பொருட்கள் பட்டியல்
          let itemsListHtml = "";
          if (order.items && Array.isArray(order.items)) {
            itemsListHtml = order.items.map(item => `
              <div>• ${item.name || 'Bangle'} x ${item.quantity || 1} - ₹${item.price || 0}</div>
            `).join("");
          } else {
            itemsListHtml = "<div>விவரங்கள் இல்லை</div>";
          }

          html += `
            <div class="order-card">
              <div class="order-header">
                <span>Order ID: #${doc.id.slice(0, 6)}</span>
                <span class="status-badge">${order.status || 'Pending'}</span>
              </div>
              
              <div class="order-details">
                <p><strong>வாடிக்கையாளர் பெயர்:</strong> ${order.name || order.customerName || 'N/A'}</p>
                <p><strong>தொலைபேசி எண்:</strong> <a href="tel:${order.phone}">${order.phone || 'N/A'}</a></p>
                <p><strong>முகவரி:</strong> ${order.address || 'N/A'}</p>
                <p><strong>ஆர்டர் தேதி:</strong> ${order.date || order.createdAt ? new Date(order.createdAt?.toDate ? order.createdAt.toDate() : order.createdAt || Date.now()).toLocaleDateString() : 'N/A'}</p>
              </div>

              <div class="order-items">
                <strong>பொருட்கள்:</strong>
                ${itemsListHtml}
              </div>

              <div class="order-total">
                மொத்த தொகை: ₹${order.total || order.totalAmount || 0}
              </div>
            </div>
          `;
        });

        ordersContainer.innerHTML = html;

      } catch (err) {
        console.error("Order load error:", err);
        ordersContainer.innerHTML = `<p style="color: red; text-align: center;">பிழை: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
