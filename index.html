<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevi Crafty Bangles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #C76B85;          /* Dusty Rose */
      --bg-cream: #FFF8F0;         /* Cream */
      --accent-gold: #D4AF37;      /* Gold */
      --text-dark: #3B2A24;        /* Dark Brown */
      --btn-rose: #B84F70;         /* Rose Pink */
      --card-pink: #FCE8EF;        /* Soft Pink */
      --white: #FFFFFF;            /* White */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      padding-bottom: 70px;
    }

    /* --- Splash Screen / Brand Intro --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-cream);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash-logo-container {
      text-align: center;
      animation: splashPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .splash-brand {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .splash-tagline {
      font-size: 0.95rem;
      color: var(--text-dark);
      margin-top: 6px;
      font-weight: 500;
    }

            .splash-logo-img {
      width: 250px;            /* அளவை 95px-லிருந்து 140px ஆக உயர்த்தியுள்ளோம் */
      height: 250px;           /* அகலத்திற்கு ஏற்ப உயரமும் 140px */
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      
      animation: splashLogoPop 1s ease-out;
    }


    @keyframes splashLogoPop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }


    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* --- Header & Navigation --- */
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--white);
      border-bottom: 1px solid var(--card-pink);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }

    .header-icons {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 1.2rem;
    }

    .header-icons a {
      color: var(--text-dark);
      text-decoration: none;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: var(--btn-rose);
      color: var(--white);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 50%;
    }

    .search-box {
      padding: 12px 16px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #e0cfcf;
      outline: none;
      background: var(--white);
      font-size: 0.9rem;
    }

    .banner {
      margin: 0 16px 16px;
      background: linear-gradient(135deg, var(--primary), var(--btn-rose));
      color: var(--white);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(199, 107, 133, 0.2);
    }

    .banner h3 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .banner p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .banner-btn {
      background: var(--accent-gold);
      color: var(--text-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .section-title {
      padding: 0 16px;
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 16px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      background: var(--card-pink);
      color: var(--text-dark);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--btn-rose);
      color: var(--white);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 20px;
    }

    .product-card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-pink);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .product-card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .product-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .product-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--btn-rose);
      margin-bottom: 8px;
    }

    .add-btn {
      margin-top: auto;
      background: var(--card-pink);
      color: var(--btn-rose);
      border: 1px solid var(--primary);
      padding: 7px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--white);
      border-top: 1px solid var(--card-pink);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.75rem;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--btn-rose);
    }

    .nav-item i {
      font-size: 1.15rem;
    }
  </style>
</head>
<body>

  <!-- Splash Screen / Brand Intro Screen -->
    <!-- Splash Screen / Brand Intro Screen -->
  <div id="splash-screen">
    <div class="splash-logo-container">
      <img src="logo.png" class="splash-logo-img" alt="Jeevi Crafts Logo" onerror="this.src='https://via.placeholder.com/95/C76B85/FFFFFF?text=Jeevi'">
      <div class="splash-brand">Jeevi Crafts</div>
      <div class="splash-tagline">Handmade Bangles & Artistic Crafts</div>
    </div>
  </div>


  <header>
    <div class="brand-title">Jeevi Crafts</div>
    <div class="header-icons">
      <a href="cart.html">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search bangles and handmade crafts...">
  </div>

  <div class="banner">
    <h3>Silk Thread Sets</h3>
    <p>Traditional handmade bangles with flat 20% OFF</p>
    <button class="banner-btn">Explore Now</button>
  </div>

  <div class="section-title">Categories</div>
  <div class="categories">
    <div class="cat-chip active" onclick="filterCat('All')">All</div>
    <div class="cat-chip" onclick="filterCat('Silk Thread')">Silk Thread</div>
    <div class="cat-chip" onclick="filterCat('Bridal Bangles')">Bridal Bangles</div>
    <div class="cat-chip" onclick="filterCat('Glass Bangles')">Glass Bangles</div>
    <div class="cat-chip" onclick="filterCat('Handmade Crafts')">Handmade Crafts</div>
  </div>

  <div class="section-title">Featured Products</div>
  <div class="products-grid" id="productsContainer">
    <p style="padding: 16px; color: #666; grid-column: span 2;">Loading products...</p>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
    <a href="cart.html" class="nav-item">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Cart</span>
    </a>
    <a href="orders.html" class="nav-item">
      <i class="fa-solid fa-box-archive"></i>
      <span>Orders</span>
    </a>
    <a href="login.html" class="nav-item" id="authNavBtn">
      <i class="fa-solid fa-user" id="authIcon"></i>
      <span id="authText">Login</span>
    </a>
  </nav>

  <script type="module">
    import { 
      auth, 
      db, 
      collection, 
      getDocs, 
      onAuthStateChanged, 
      signOut 
    } from "./js/firebase-config.js";

    // Automatic Splash Screen fade out
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.classList.add("splash-hidden");
        }
      }, 1800);
    });

    const ADMIN_EMAIL = "tharuntharu7489@gmail.com";
    const authNavBtn = document.getElementById("authNavBtn");
    const authText = document.getElementById("authText");
    const authIcon = document.getElementById("authIcon");
    const container = document.getElementById("productsContainer");
    const cartCount = document.getElementById("cartCount");

    let allProducts = [];

    // Authentication and Admin Role Check
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email === ADMIN_EMAIL) {
          authText.innerText = "Admin";
          authIcon.className = "fa-solid fa-user-shield";
          authNavBtn.href = "admin/index.html";
          authNavBtn.onclick = null;
        } else {
          authText.innerText = "Logout";
          authIcon.className = "fa-solid fa-right-from-bracket";
          authNavBtn.href = "#";
          authNavBtn.onclick = async (e) => {
            e.preventDefault();
            await signOut(auth);
            alert("You have been logged out successfully!");
            window.location.reload();
          };
        }
      } else {
        authText.innerText = "Login";
        authIcon.className = "fa-solid fa-user";
        authNavBtn.href = "login.html";
        authNavBtn.onclick = null;
      }
    });

    // Update Cart Badge Counter
    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      cartCount.innerText = totalItems;
    }
    updateCartBadge();

    // Fetch Products from Firestore
    async function fetchProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        querySnapshot.forEach(doc => {
          allProducts.push({ id: doc.id, ...doc.data() });
        });
        renderProducts(allProducts);
      } catch (err) {
        container.innerHTML = "<p style='color: red; padding: 16px;'>Failed to load products.</p>";
      }
    }

    // Render Product Cards linked to product.html?id=...
    function renderProducts(items) {
      if (items.length === 0) {
        container.innerHTML = "<p style='padding: 16px; color: #666; grid-column: span 2;'>No products found.</p>";
        return;
      }
      container.innerHTML = items.map(p => `
        <div class="product-card">
          <a href="product.html?id=${p.id}" class="product-card-link">
            <img src="${p.imageUrl}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">₹${p.price}</div>
            </div>
          </a>
          <div style="padding: 0 10px 10px;">
            <button class="add-btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.imageUrl}')">Add to Cart</button>
          </div>
        </div>
      `).join("");
    }

    // Category Filter
    window.filterCat = (category) => {
      document.querySelectorAll(".cat-chip").forEach(el => el.classList.remove("active"));
      event.target.classList.add("active");
      if (category === "All") {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === category);
        renderProducts(filtered);
      }
    };

    // Add To Cart Functionality (Defaults to Free Size from Home view)
    window.addToCart = (id, name, price, imageUrl) => {
      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const existing = cart.find(i => i.id === id && i.size === "Free Size");
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ id, name, price, imageUrl, size: "Free Size", quantity: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartBadge();
      alert("Item added to cart!");
    };

    // Search Filter
    document.getElementById("searchInput").oninput = (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    };

    fetchProducts();
  </script>
</body>
</html>
