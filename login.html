<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Jeevi Crafty Bangles</title>
  <style>
    :root {
      --primary: #C76B85;
      --bg-cream: #FFF8F0;
      --accent-gold: #D4AF37;
      --text-dark: #3B2A24;
      --btn-rose: #B84F70;
      --card-pink: #FCE8EF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .auth-container {
      background-color: var(--white);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(59, 42, 36, 0.08);
      border: 1px solid var(--card-pink);
    }

    .brand-title {
      color: var(--primary);
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .tagline {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--card-pink);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--btn-rose);
      border-bottom: 3px solid var(--btn-rose);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #E0D3C9;
      border-radius: 8px;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--btn-rose);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .msg-box {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .error { background-color: #ffe6e6; color: #d63031; }
    .success { background-color: #e6ffed; color: #27ae60; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2 class="brand-title">Jeevi Crafty Bangles</h2>
    <p class="tagline">Traditional & Handmade Crafts</p>

    <div class="tabs">
      <button class="tab-btn active" id="loginTab">Login</button>
      <button class="tab-btn" id="signupTab">Sign Up</button>
    </div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="userName">Full Name</label>
        <input type="text" id="userName" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="userEmail">Email Address</label>
        <input type="email" id="userEmail" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="userPassword">Password</label>
        <input type="password" id="userPassword" required placeholder="At least 6 characters">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Login</button>
    </form>

    <div id="feedback" class="msg-box"></div>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      setDoc, 
      doc 
    } from "./js/firebase-config.js";

    let isLoginMode = true;

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const nameGroup = document.getElementById("nameGroup");
    const submitBtn = document.getElementById("submitBtn");
    const authForm = document.getElementById("authForm");
    const feedback = document.getElementById("feedback");

    loginTab.onclick = () => {
      isLoginMode = true;
      loginTab.classList.add("active");
      signupTab.classList.remove("active");
      nameGroup.style.display = "none";
      submitBtn.innerText = "Login";
      feedback.style.display = "none";
    };

    signupTab.onclick = () => {
      isLoginMode = false;
      signupTab.classList.add("active");
      loginTab.classList.remove("active");
      nameGroup.style.display = "block";
      submitBtn.innerText = "Sign Up";
      feedback.style.display = "none";
    };

    authForm.onsubmit = async (e) => {
      e.preventDefault();
      feedback.style.display = "none";

      const email = document.getElementById("userEmail").value.trim();
      const password = document.getElementById("userPassword").value;
      const name = document.getElementById("userName").value.trim();

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
          showFeedback("Login successful! Redirecting to home...", "success");
          setTimeout(() => window.location.href = "index.html", 1200);
        } else {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          
          // Save customer profile data to Firestore
          await setDoc(doc(db, "users", res.user.uid), {
            name: name || "Customer",
            email: email,
            createdAt: new Date().toISOString()
          });

          showFeedback("Account created successfully! Redirecting to home...", "success");
          setTimeout(() => window.location.href = "index.html", 1200);
        }
      } catch (err) {
        showFeedback(err.message, "error");
      }
    };

    function showFeedback(text, type) {
      feedback.innerText = text;
      feedback.className = `msg-box ${type}`;
      feedback.style.display = "block";
    }
  </script>
</body>
</html>
