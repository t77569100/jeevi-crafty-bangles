<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Jeevi Crafty Bangles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #C76B85;
      --bg-cream: #FFF8F0;
      --accent-gold: #D4AF37;
      --text-dark: #3B2A24;
      --btn-rose: #B84F70;
      --card-pink: #FCE8EF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 30px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--card-pink);
    }

    header a {
      color: var(--text-dark);
      font-size: 1.2rem;
      text-decoration: none;
    }

    header h2 {
      font-size: 1.2rem;
      color: var(--primary);
    }

    .section-card {
      background: var(--white);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--card-pink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--btn-rose);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dcccd0;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      background: var(--bg-cream);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .item-meta {
      font-size: 0.8rem;
      color: #777;
    }

    .total-row {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--btn-rose);
      border-top: 1px dashed #dcccd0;
      padding-top: 10px;
      margin-top: 10px;
    }

    /* Payment Methods */
    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ecc9d4;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
    }

    .pay-btn {
      width: 100%;
      background: var(--btn-rose);
      color: var(--white);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .pay-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .demo-tag {
      font-size: 0.75rem;
      background: var(--card-pink);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* Flipkart / Meesho Style Full Page Success Modal */
    .order-success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-cream);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 24px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .order-success-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .success-circle {
      width: 88px;
      height: 88px;
      background: #27ae60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(39, 174, 96, 0.35);
      margin-bottom: 20px;
      animation: popSuccess 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .success-circle i {
      font-size: 2.8rem;
      color: var(--white);
    }

    @keyframes popSuccess {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .success-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .success-sub {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 22px;
    }

    .order-id-box {
      background: var(--white);
      border: 1.5px dashed var(--btn-rose);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--btn-rose);
      margin-bottom: 25px;
      width: 100%;
      max-width: 320px;
    }

    .success-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-view-order {
      background: var(--btn-rose);
      color: var(--white);
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(184, 79, 112, 0.3);
    }

    .btn-home-link {
      color: var(--text-dark);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="cart.html"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Checkout & Payment</h2>
  </header>

  <!-- 1. Delivery Details -->
  <div class="section-card">
    <div class="card-title"><i class="fa-solid fa-location-dot"></i> Delivery Address</div>
    <form id="addressForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="custName" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile number">
      </div>
      <div class="form-group">
        <label>Street Address / Door No.</label>
        <textarea id="custAddress" rows="2" required placeholder="House No., Street Name, Area / Landmark"></textarea>
      </div>
      <div class="form-group">
        <label>Postal Code (Pincode)</label>
        <input type="number" id="custPin" required placeholder="e.g. 600001">
      </div>
    </form>
  </div>

  <!-- 2. Order Summary -->
  <div class="section-card">
    <div class="card-title"><i class="fa-solid fa-receipt"></i> Order Summary</div>
    <div id="summaryItems"></div>
    <div class="summary-row total-row">
      <span>Grand Total</span>
      <span id="finalTotal">₹0</span>
    </div>
  </div>

  <!-- 3. Payment Method -->
  <div class="section-card">
    <div class="card-title">
      <i class="fa-solid fa-credit-card"></i> Payment Method 
      <span class="demo-tag">Demo Mode</span>
    </div>

    <label class="payment-option">
      <input type="radio" name="payment" value="GPay / PhonePe" checked>
      <span>Google Pay / PhonePe (UPI)</span>
    </label>

    <label class="payment-option">
      <input type="radio" name="payment" value="Credit/Debit Card">
      <span>Cards (Credit / Debit)</span>
    </label>

    <label class="payment-option">
      <input type="radio" name="payment" value="Cash on Delivery">
      <span>Cash on Delivery (COD)</span>
    </label>

    <button type="button" class="pay-btn" id="placeOrderBtn">Confirm & Pay (Demo)</button>
  </div>

  <!-- Full Page Order Success Screen -->
  <div id="orderSuccessScreen" class="order-success-overlay">
    <div class="success-circle">
      <i class="fa-solid fa-check"></i>
    </div>
    <h2 class="success-title">Order Placed!</h2>
    <p class="success-sub">Thank you for shopping with Jeevi Crafts.</p>

    <div class="order-id-box">
      Order ID: <span id="displayOrderId">#123456</span>
    </div>

    <div class="success-actions">
      <a href="orders.html" id="viewOrderBtn" class="btn-view-order">View Order Status</a>
      <a href="index.html" class="btn-home-link">Continue Shopping</a>
    </div>
  </div>

  <script type="module">
    import { auth, db, collection, addDoc, onAuthStateChanged } from "./js/firebase-config.js";

    let currentUser = null;
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert("Please log in first to continue checkout!");
        window.location.href = "login.html";
      } else {
        currentUser = user;
      }
    });

    if (cart.length === 0) {
      window.location.href = "index.html";
    }

    const summaryContainer = document.getElementById("summaryItems");
    let total = 0;

    cart.forEach(item => {
      const itemQty = item.quantity || 1;
      const itemPrice = item.price || 0;
      const itemSize = item.size || "Free Size";
      total += itemPrice * itemQty;

      const row = document.createElement("div");
      row.className = "summary-row";
      row.innerHTML = `
        <div>
          <span>${item.name} x ${itemQty}</span>
          <div class="item-meta">Size: ${itemSize}</div>
        </div>
        <span>₹${itemPrice * itemQty}</span>
      `;
      summaryContainer.appendChild(row);
    });

    document.getElementById("finalTotal").innerText = `₹${total}`;

    document.querySelectorAll('input[name="payment"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const btn = document.getElementById("placeOrderBtn");
        if (e.target.value === "Cash on Delivery") {
          btn.innerText = "Place Order (COD)";
        } else {
          btn.innerText = "Confirm & Pay (Demo)";
        }
      });
    });

    document.getElementById("placeOrderBtn").onclick = async () => {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const pin = document.getElementById("custPin").value.trim();

      if (!name || !phone || !address || !pin) {
        alert("Please fill in all delivery address details!");
        return;
      }

      const payMode = document.querySelector('input[name="payment"]:checked').value;
      const btn = document.getElementById("placeOrderBtn");
      btn.disabled = true;
      btn.innerText = "Processing Order...";

      try {
        const demoTxnId = payMode === "Cash on Delivery" 
          ? "COD_" + Date.now() 
          : "DEMO_TXN_" + Math.floor(100000 + Math.random() * 900000);

        const orderRef = await addDoc(collection(db, "orders"), {
          userId: currentUser.uid,
          userEmail: currentUser.email,
          customerName: name,
          phone: phone,
          address: `${address}, Pincode: ${pin}`,
          items: cart,
          totalAmount: total,
          paymentMethod: payMode,
          paymentStatus: payMode === "Cash on Delivery" ? "Pending" : "Success (Demo)",
          transactionId: demoTxnId,
          orderStatus: "Placed",
          orderDate: new Date().toISOString()
        });

        localStorage.setItem("lastOrderId", orderRef.id);
        localStorage.removeItem("cart");

        // Meesho / Flipkart Full-Page Success Trigger
        document.getElementById("displayOrderId").innerText = "#" + orderRef.id.slice(0, 8).toUpperCase();
        document.getElementById("viewOrderBtn").href = `orders.html?id=${orderRef.id}`;
        document.getElementById("orderSuccessScreen").classList.add("active");

      } catch (err) {
        alert("An error occurred: " + err.message);
        btn.disabled = false;
        btn.innerText = payMode === "Cash on Delivery" ? "Place Order (COD)" : "Confirm & Pay (Demo)";
      }
    };
  </script>
</body>
</html>
